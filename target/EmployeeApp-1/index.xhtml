<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Employee Management System</title>
    </h:head>
    <h:body>
        <h:form>
            <p:growl id="growl" showDetail="true" />
            
            <p:panel header="Employee List">
                <p:commandButton value="Add Employee" action="add-employee.xhtml?faces-redirect=true" 
                                 icon="pi pi-plus" style="margin-bottom: 10px"/>
                
                <p:dataTable var="emp" value="#{employeeBean.employees}" 
                             paginator="true" rows="10"
                             emptyMessage="No employees found">
                    <p:column headerText="ID">
                        <h:outputText value="#{emp.id}" />
                    </p:column>
                    <p:column headerText="First Name">
                        <h:outputText value="#{emp.firstName}" />
                    </p:column>
                    <p:column headerText="Last Name">
                        <h:outputText value="#{emp.lastName}" />
                    </p:column>
                    <p:column headerText="Email">
                        <h:outputText value="#{emp.email}" />
                    </p:column>
                    <p:column headerText="Department">
                        <h:outputText value="#{emp.department}" />
                    </p:column>
                    <p:column headerText="Salary">
                        <h:outputText value="#{emp.salary}">
                            <f:convertNumber type="currency" currencySymbol="$" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Actions">
                        <p:commandButton icon="pi pi-pencil" title="Edit" 
                                         action="#{employeeBean.loadEmployee(emp.id)}" />
                        <p:commandButton icon="pi pi-trash" title="Delete" 
                                         update="growl"
                                         action="#{employeeBean.deleteEmployee(emp.id)}">
                            <p:confirm header="Confirmation" message="Are you sure you want to delete this employee?" 
                                        icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                        <p:confirmDialog global="true">
                            <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
                        </p:confirmDialog>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </h:body>
</html>
