<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Edit Employee</title>
    </h:head>
    <h:body>
        <h:form>
            <p:growl id="growl" showDetail="true" />
            
            <p:panel header="Edit Employee">
                <p:panelGrid columns="2" layout="grid" style="width: 100%">
                    <p:outputLabel for="firstName" value="First Name: *" />
                    <p:inputText id="firstName" value="#{employeeBean.employee.firstName}" required="true" 
                                 requiredMessage="First name is required" />
                    
                    <p:outputLabel for="lastName" value="Last Name: *" />
                    <p:inputText id="lastName" value="#{employeeBean.employee.lastName}" required="true" 
                                 requiredMessage="Last name is required" />
                    
                    <p:outputLabel for="email" value="Email: *" />
                    <p:inputText id="email" value="#{employeeBean.employee.email}" required="true" 
                                 requiredMessage="Email is required">
                        <f:validator validatorId="emailValidator" />
                    </p:inputText>
                    
                    <p:outputLabel for="department" value="Department: " />
                    <p:inputText id="department" value="#{employeeBean.employee.department}" />
                    
                    <p:outputLabel for="salary" value="Salary: *" />
                    <p:inputNumber id="salary" value="#{employeeBean.employee.salary}" required="true" 
                                   requiredMessage="Salary is required" minValue="0" />
                </p:panelGrid>
                
                <p:commandButton value="Update" action="#{employeeBean.updateEmployee}" 
                                 icon="pi pi-check" update="growl" />
                <p:commandButton value="Cancel" action="index.xhtml?faces-redirect=true" 
                                 icon="pi pi-times" immediate="true" />
            </p:panel>
        </h:form>
    </h:body>
</html>
